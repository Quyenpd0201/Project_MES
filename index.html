<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bao Bì Ngọc An Thư · Hệ thống MES</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <!-- Tailwind via Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Phối màu theo thương hiệu Bao Bì Ngọc An Thư (xanh #0055b3)
      tailwind.config = {
        theme: { extend: { colors: {
          blue: {
            50: "#e7f0fa", 100: "#c4dcf2", 200: "#8fbbe6", 300: "#5a99d9",
            400: "#2e7ccb", 500: "#0a63b8", 600: "#0055b3", 700: "#00428c",
            800: "#003066", 900: "#001f42",
          },
        } } },
      };
    </script>
    <style>
      body { margin: 0; background: #f1f5f9; font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; }

      /* Thanh cuộn mảnh, mờ — ẩn lúc thường, hiện nhẹ khi rê chuột (sidebar + vùng nội dung) */
      .nav-scroll { scrollbar-width: thin; scrollbar-color: transparent transparent; }
      .nav-scroll:hover { scrollbar-color: rgba(148,163,184,.45) transparent; }
      .nav-scroll::-webkit-scrollbar { width: 6px; }
      .nav-scroll::-webkit-scrollbar-track { background: transparent; }
      .nav-scroll::-webkit-scrollbar-thumb { background: transparent; border-radius: 9999px; transition: background .2s; }
      .nav-scroll:hover::-webkit-scrollbar-thumb { background: rgba(148,163,184,.35); }
      .nav-scroll::-webkit-scrollbar-thumb:hover { background: rgba(148,163,184,.6); }

      .btn-primary { display:inline-flex; align-items:center; gap:.4rem; background:#0055b3; color:#fff;
        font-size:.875rem; font-weight:500; padding:.5rem .9rem; border-radius:.6rem; transition:.15s; }
      .btn-primary:hover { background:#00428c; }
      .btn-ghost { display:inline-flex; align-items:center; gap:.4rem; background:#fff; color:#475569;
        font-size:.875rem; font-weight:500; padding:.5rem .9rem; border-radius:.6rem; border:1px solid #e2e8f0; transition:.15s; }
      .btn-ghost:hover { background:#f8fafc; }
      /* Trường chỉ-đọc (chế độ xem): rõ chữ, không bị mờ */
      input:disabled, select:disabled, textarea:disabled {
        background:#f8fafc; color:#334155; -webkit-text-fill-color:#334155; opacity:1; cursor:default; }
      
      /* Xử lý placeholder: mờ khi bình thường, ẩn hoàn toàn khi bị disabled */
      input::placeholder, textarea::placeholder {
        color: #94a3b8 !important; -webkit-text-fill-color: #94a3b8 !important; opacity: 1;
      }
      input:disabled::placeholder, textarea:disabled::placeholder {
        color: transparent !important; -webkit-text-fill-color: transparent !important;
      }
      fieldset { min-width:0; border:0; margin:0; padding:0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
